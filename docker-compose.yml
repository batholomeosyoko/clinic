services:
  postgres:
    image: postgres:16
    container_name: hcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - hcms_pgdata:/var/lib/postgresql/data
volumes:
  hcms_pgdata:
